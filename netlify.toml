[build]
  command = ""
  publish = "."

[[redirects]]
  from = "/api/*"
  to = "https://studybull-hub.vercel.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/admin.html"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Cache-Control = "no-store"
