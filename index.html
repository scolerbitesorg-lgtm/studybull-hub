projects.splice(5,1);const $=s=>document.querySelector(s);let saved=[];try{saved=JSON.parse(localStorage.getItem('studybull-library')||'[]');if(!Array.isArray(saved))saved=[];saved=saved.filter(id=>projects.some(p=>p.id===id))}catch{}let filter='All',query='';function render(){const list=projects.filter(p=>(filter==='All'||p.category===filter)&&(p.title+' '+p.category+' '+p.description).toLowerCase().includes(query));$('#projects').innerHTML=list.length?list.map(p=>`<article class="card"><div class="cover ${p.color}"><small>${p.category}</small><h3>${p.heading}</h3><p>${p.sub}</p><span class="symbol" aria-hidden="true">${p.symbol}</span></div><div class="body"><div class="badges"><span class="badge ${p.status==='Coming soon'?'soon':''}">${p.status}</span><span>${p.category}</span></div><h3>${p.title}</h3><p>${p.description}</p><div class="cardfoot">${p.url?`<a class="open" href="${p.url}" target="_blank" rel="noopener">${p.action} ↗</a>`:`<button class="open" data-open="${p.id}">${p.action} →</button>`}<button class="save ${saved.includes(p.id)?'selected':''}" data-save="${p.id}" aria-label="${saved.includes(p.id)?'Unsave':'Save'} ${p.title}" aria-pressed="${saved.includes(p.id)}">${saved.includes(p.id)?'▣':'▧'}</button></div></div></article>`).join(''):'<p class="empty">Koi matching project nahi mila. Dusra naam ya category try karo.</p>';$('#count').textContent=saved.length}function setFilter(f){filter=f;document.querySelectorAll('[data-filter]').forEach(b=>{b.classList.toggle('active',b.dataset.filter===f);b.setAttribute('aria-pressed',b.dataset.filter===f)});render()}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>setFilter(b.dataset.filter));$('#search').oninput=e=>{query=e.target.value.toLowerCase().trim();render()};$('#apknav').onclick=()=>setFilter('APKs');function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(window.tid);window.tid=setTimeout(()=>$('#toast').classList.add('hidden'),2600)}function const questions=[{q:'200 ka 25% kitna hota hai?',a:['25','50','75','100'],correct:1,why:'25% = 1/4. Isliye 200 ÷ 4 = 50.'},{q:'Series complete karo: 3, 6, 12, 24, ?',a:['30','36','48','60'],correct:2,why:'Har number pichhle number ka double hai. 24 × 2 = 48.'},{q:'10, 20 aur 30 ka average kya hai?',a:['15','20','25','30'],correct:1,why:'Average = total ÷ count. (10 + 20 + 30) ÷ 3 = 20.'},{q:'Ratio 2:3 hai aur total 50. Chhota hissa kitna hai?',a:['10','20','25','30'],correct:1,why:'Total parts = 5. Chhota hissa = (2/5) × 50 = 20.'},{q:'4 km east, phir 3 km north. Start se seedhi doori?',a:['1 km','5 km','7 km','12 km'],correct:1,why:'Right triangle: √(4² + 3²) = √25 = 5 km.'}];let qi=0,score=0,answered=false;function startQuiz(){qi=0;score=0;drawQuiz()}function drawQuiz(){answered=false;const q=questions[qi];show(`<div class="eyebrow">Quick practice · sample quiz</div><div class="qmeta"><span>Question ${qi+1} of 5</span><span>Score: ${score}</span></div><h2>${q.q}</h2>${q.a.map((a,i)=>`<button class="option" data-answer="${i}">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}<div id="feedback" aria-live="polite"></div><p style="font-size:10px">Original sample questions. Official exam paper nahi hai.</p>`);document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const idx=Number(b.dataset.answer);if(idx===q.correct)score++;document.querySelectorAll('[data-answer]').forEach((x,i)=>{x.disabled=true;if(i===q.correct)x.classList.add('correct');else if(i===idx)x.classList.add('wrong')});$('#feedback').innerHTML=`<p><strong>${idx===q.correct?'Sahi jawab!':'Koi baat nahi, seekhte raho.'}</strong><br>${q.why}</p><button class="btn" id="nextq">${qi===4?'See my score':'Next question →'}</button>`;$('#nextq').onclick=()=>{qi++;if(qi<5)drawQuiz();else{show(`<div class="eyebrow">Practice complete</div><h2>Quiz result</h2><div class="result">${score} / 5</div><p>${score>=4?'Achhi practice! Is momentum ko continue rakho.':'Practice se improvement aati hai. Ek baar aur try karo.'}</p><div class="actions"><button class="btn" id="retry">Try again</button><a class="btn outline" href="https://studybull.vercel.app/" target="_blank" rel="noopener">Full test portal ↗</a></div>`);$('#retry').onclick=startQuiz}}})}document.querySelectorAll('.quizstart').forEach(b=>b.onclick=startQuiz);
const sheet='STUDYBULL - MATHS REVISION POCKET\nOriginal basic revision sheet\n\nPERCENTAGE\nx% of y = (x / 100) * y\nExample: 25% of 200 = 50\n\nAVERAGE\nAverage = sum of values / number of values\nExample: (10 + 20 + 30) / 3 = 20\n\nRATIO\nFor a:b and total T, first share = a*T/(a+b)\nExample: 2:3, total 50 gives 20 and 30\n\nSIMPLE INTEREST\nSI = P*R*T/100 (R annual %, T in years)\nAmount = Principal + SI\n\nSPEED, DISTANCE, TIME\nSpeed = distance / time\nUse consistent units. km/h to m/s: multiply by 5/18.\n\nA short practice aid, not a complete exam syllabus.\n';function showNotes(){show('<div class="eyebrow">Free · original resource</div><h2>Maths revision pocket</h2><p>Chhoti sheet, quick revision. Complete exam syllabus nahi.</p><div id="sheet" style="white-space:pre-wrap;font-size:12px;line-height:1.9;background:var(--bg);padding:18px;border-radius:10px"></div><br><button class="btn" id="download">Download .txt ↓</button>');$('#sheet').textContent=sheet;$('#download').onclick=()=>{const u=URL.createObjectURL(new Blob([sheet],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='studybull-maths-revision.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}}$('#privacy').onclick=()=>show('<div class="eyebrow">Simple & clear</div><h2>Your study space, your data.</h2><p>This home page has no sign-up, payment form or custom analytics. Saved project IDs stay in local storage in your current browser. Clear browser site data to remove them.</p><p>Fonts load from Google Fonts. Hosting services receive normal request data, such as IP address. External study projects have their own privacy rules.</p>');render();

document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('current',x.dataset.view===b.dataset.view));const v=b.dataset.view;query='';$('#search').value='';if(v==='home'){setFilter('All');$('#pagetitle').textContent='Overview'}if(v==='tests'){setFilter('Practice');$('#pagetitle').textContent='Tests & quizzes'}if(v==='apps'){setFilter('APKs');$('#pagetitle').textContent='Apps'}if(v==='saved'){$('#library').click()}if(v==='home'||v==='tests'||v==='apps')window.scrollTo({top:0,behavior:'smooth'})});
