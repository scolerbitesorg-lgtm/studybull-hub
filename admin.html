<!doctype html>
<html lang="en">
<head>

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'">
<title>StudyBull | Owner panel</title>
<style>
:root{--green:#174d3c;--green2:#285f4a;--lime:#dce8b8;--ink:#203a30;--muted:#728072;--line:#dfe6d9;--bg:#f6f7f1;--card:#fff;--red:#984332;--amber:#86601d}
*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--green);background:var(--green);border-radius:9px;padding:10px 15px;color:#fff;min-height:42px;font-size:13px}button.secondary{background:#fff;border-color:var(--line);color:var(--ink)}button.danger{background:#fff7f4;border-color:#e7c5ba;color:var(--red)}button.ghost{background:transparent;border-color:transparent;color:var(--green)}button:disabled{opacity:.65;cursor:not-allowed;background:#e4e9de;color:#6b776b;border-color:#d4ddcb}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #a4b876;outline-offset:2px}a{color:inherit}h1,h2,h3,p{margin-top:0}h1{font-size:28px;letter-spacing:-.7px;margin-bottom:4px}h2{font-size:20px;margin-bottom:10px}h3{font-size:16px;margin-bottom:7px}.muted{color:var(--muted);font-size:13px}.small{font-size:12px}.caps{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#70875c;font-weight:800}.hide{display:none!important}.shell{min-height:100vh}.topbar{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:10}.brand{font-size:21px;font-weight:800;text-decoration:none}.layout{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:calc(100vh - 66px)}.sidebar{background:#eef2e5;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:66px;height:calc(100vh - 66px);overflow:auto}.sidebar button{width:100%;display:flex;justify-content:space-between;align-items:center;background:transparent;color:var(--ink);border:0;padding:11px 12px;border-radius:9px;text-align:left;margin:2px 0}.sidebar button.active{background:var(--green);color:#fff}.sidebar button span:last-child{font-size:11px;opacity:.75}.content{padding:26px;max-width:1280px;width:100%;margin:0 auto}.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin:16px 0}.panel.tight{padding:16px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.status{border-radius:9px;background:#edf3e3;padding:11px 14px;margin:12px 0;font-size:13px}.status.error{background:#fff1ed;color:#933e2d}.status.warn{background:#fff7de;color:var(--amber)}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;background:#edf2df;padding:4px 9px;font-size:11px}.badge.red{background:#fff0ed;color:var(--red)}.badge.green{background:#e5f2e4;color:#2e6940}.badge.amber{background:#fff5d6;color:var(--amber)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px}.stat b{display:block;font-size:27px;letter-spacing:-.8px}.stat span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.list{display:grid;gap:10px}.item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.item>div:first-child{min-width:0}.item p{margin:4px 0;color:var(--muted);font-size:12px;overflow-wrap:anywhere}.item .actions{flex-shrink:0}.empty{padding:30px;text-align:center;border:1px dashed #c7d2bc;border-radius:12px;color:var(--muted)}label{display:grid;gap:6px;font-size:12px;margin:12px 0;color:#526252}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 12px;background:#fff;min-height:44px}textarea{min-height:90px;resize:vertical}input[type=checkbox]{width:auto;min-height:auto}select{padding-right:34px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.formgrid .full{grid-column:1/-1}.login{max-width:460px;margin:64px auto}.login .panel{padding:30px}.loginlock{display:grid;place-items:center;width:54px;height:54px;border-radius:15px;background:#e7efd5;color:var(--green);font-size:28px;margin-bottom:18px}.savebar{position:sticky;bottom:12px;z-index:8;padding:13px 16px;background:#f0f4e8;border:1px solid #ccd9b6;border-radius:12px;box-shadow:0 5px 25px #0001;margin-top:22px;display:flex;justify-content:space-between;gap:15px;align-items:center}.unsaved{font-weight:800;color:var(--amber)}dialog{border:1px solid var(--line);border-radius:14px;padding:24px;max-width:680px;width:calc(100% - 30px);color:var(--ink)}dialog.wide{max-width:900px}dialog::backdrop{background:#173d3266;backdrop-filter:blur(3px)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:11px;color:var(--muted);font-weight:700}tr:last-child td{border-bottom:0}.tablewrap{overflow:auto}.bannerpreviews{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.bannerpreview{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff}.bannerpreview img{width:100%;max-height:190px;object-fit:cover;display:block}.bannerpreview>.row{padding:13px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.pillbar{display:flex;gap:8px;overflow:auto;margin:10px 0 16px;padding-bottom:4px}.pillbar button{white-space:nowrap}.code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:#f2f4ec;border-radius:6px;padding:2px 5px}.logline{display:flex;gap:12px;border-bottom:1px solid #edf0e5;padding:10px 0;font-size:12px}.logline time{color:var(--muted);white-space:nowrap}.warningbox{border:1px solid #e7d59a;background:#fff9df;border-radius:11px;padding:14px;color:#6d5518;font-size:13px}.lockscreen{text-align:center;padding:60px 20px}.lockscreen h2{font-size:28px}.mobilemenu{display:none}.count{font-size:11px;color:var(--muted)}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:fixed;z-index:20;left:0;right:0;top:66px;height:auto;max-height:calc(100vh - 66px);transform:translateY(-110%);transition:.2s}.sidebar.open{transform:none}.mobilemenu{display:inline-flex}.content{padding:18px 14px}.stats,.grid,.bannerpreviews{grid-template-columns:1fr}.hero{display:block}.formgrid{grid-template-columns:1fr}.topbar{padding:0 14px}.item{display:block}.item .actions{margin-top:12px}.savebar{display:block}.savebar .actions{margin-top:10px}}
</style>
